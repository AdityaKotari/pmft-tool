[project]
name = "fundscraper"
version = "0.1.0"
description = "EDGAR Form D funding scraper"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "duckdb==1.5.3",
    "edgartools==5.35.0",
    "sqlalchemy==2.0.50",
    "typer==0.26.6",
]

[tool.hatch.build.targets.wheel]
packages = ["fundscraper"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
fundscraper = "fundscraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
exclude = ["migrations/"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "edgar.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
